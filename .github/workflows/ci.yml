name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests (SQLite and PostgreSQL)
        env:
          GNUBOOK_TEST_PG_URL: postgresql://postgres:postgres@127.0.0.1:5432
          GNUBOOK_TEST_PG_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: pytest -q -rs

  gnucash-compat:
    # books written by gnubook are read back with the official GnuCash engine
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GnuCash Python bindings
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-gnucash python3-venv
      - name: Install gnubook
        run: python3 -m venv .venv && .venv/bin/pip install -q -e ".[dev]"
      - name: Compatibility test
        env:
          GNUCASH_PYTHON: /usr/bin/python3
        run: .venv/bin/pytest -q -rs tests/test_gnucash_compat.py tests/test_pp_sync.py::test_gnucash_reads_the_pp_bookings

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          for f in deploy/install.sh deploy/update.sh deploy/install-pp.sh ppcore/build.sh ppcore/configure.sh \
                   ppcore/ppcore-run ppcore/smoke-test.sh; do bash -n "$f"; done

  ppcore:
    # pp-core compiled against and started with the Portfolio Performance release install-pp.sh installs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Download Portfolio Performance
        run: |
          V=$(sed -n 's/^TESTED_PP_VERSION=//p' deploy/install-pp.sh)
          curl -fsSL --retry 3 -o pp.tar.gz \
            "https://github.com/portfolio-performance/portfolio/releases/download/$V/PortfolioPerformance-$V-linux.gtk.x86_64.tar.gz"
          mkdir pp && tar -xzf pp.tar.gz -C pp
      - name: Build, start and call pp-core
        run: bash ppcore/smoke-test.sh pp/portfolio
