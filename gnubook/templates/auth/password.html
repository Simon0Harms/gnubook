{% extends "base.html" %}
{% block title %}{{ _("Konto und Sprache") }}{% endblock %}
{% block header %}{{ _("Konto und Sprache") }}{% endblock %}
{% block content %}
<div class="card mb-4" style="max-width: 32rem">
  <div class="card-header"><h3 class="card-title">{{ _("Sprache") }}</h3></div>
  <div class="card-body">
    <form method="post" action="{{ url_for('auth.account_language') }}" class="d-flex gap-2">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <select class="form-select" name="language" aria-label="{{ _("Sprache") }}">
        {% for code, label in LANGUAGES.items() %}<option value="{{ code }}" {{ 'selected' if code == lang }}>{{ label }}</option>{% endfor %}
      </select>
      <button class="btn btn-primary" type="submit">{{ _("Speichern") }}</button>
    </form>
  </div>
</div>
{% if not current_user['is_demo'] %}
<div class="card" style="max-width: 32rem">
  <div class="card-header"><h3 class="card-title">{{ _("Passwort ändern") }}</h3></div>
  <div class="card-body">
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3"><label class="form-label" for="o">{{ _("Bisheriges Passwort") }}</label><input class="form-control" type="password" id="o" name="old" required autocomplete="current-password"></div>
    <div class="mb-3"><label class="form-label" for="n">{{ _("Neues Passwort (min. 10 Zeichen)") }}</label><input class="form-control" type="password" id="n" name="new" required minlength="10" autocomplete="new-password"></div>
    <div class="mb-3"><label class="form-label" for="n2">{{ _("Wiederholen") }}</label><input class="form-control" type="password" id="n2" name="new2" required minlength="10" autocomplete="new-password"></div>
    <button class="btn btn-success" type="submit">{{ _("Ändern") }}</button>
  </form>
</div></div>
{% endif %}
{% endblock %}
